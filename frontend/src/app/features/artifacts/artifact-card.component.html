<div
  [style.border-color]="selected ? '#6366f1' : '#e2e8f0'"
  style="background:#f8fafc;border:1px solid;border-radius:10px;padding:14px;transition:border-color .15s;"
>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;">
    <div style="display:flex;align-items:center;gap:10px;min-width:0;">
      <input
        type="checkbox"
        [checked]="selected"
        (change)="onSelectChange($any($event.target).checked)"
        style="width:15px;height:15px;accent-color:#6366f1;flex-shrink:0;cursor:pointer;"
      />
      <span style="display:flex;align-items:center;flex-shrink:0;">
        @switch (artifact.type) {
          @case ('pdf') {
            <svg width="22" height="26" viewBox="0 0 22 26" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="1" y="1" width="20" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" />
              <path d="M13 1v5a1 1 0 001 1h5" stroke="#ef4444" stroke-width="1.2" stroke-linecap="round" />
              <text x="11" y="19" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="6.5" font-weight="700" fill="#ef4444">PDF</text>
            </svg>
          }
          @case ('excel') {
            <svg width="22" height="26" viewBox="0 0 22 26" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="1" y="1" width="20" height="24" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" />
              <path d="M13 1v5a1 1 0 001 1h5" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round" />
              <line x1="5" y1="11" x2="17" y2="11" stroke="#16a34a" stroke-width=".8" opacity=".5" />
              <line x1="5" y1="14.5" x2="17" y2="14.5" stroke="#16a34a" stroke-width=".8" opacity=".5" />
              <line x1="5" y1="18" x2="17" y2="18" stroke="#16a34a" stroke-width=".8" opacity=".5" />
              <line x1="11" y1="9" x2="11" y2="21" stroke="#16a34a" stroke-width=".8" opacity=".5" />
              <text x="11" y="19.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="5.5" font-weight="700" fill="#16a34a">XLS</text>
            </svg>
          }
          @case ('chart') {
            <svg width="22" height="26" viewBox="0 0 22 26" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="1" y="1" width="20" height="24" rx="3" fill="#ffedd5" stroke="#f97316" stroke-width="1.2" />
              <path d="M13 1v5a1 1 0 001 1h5" stroke="#f97316" stroke-width="1.2" stroke-linecap="round" />
              <rect x="5" y="17" width="3" height="5" rx=".5" fill="#f97316" opacity=".9" />
              <rect x="9.5" y="13" width="3" height="9" rx=".5" fill="#818cf8" opacity=".9" />
              <rect x="14" y="15" width="3" height="7" rx=".5" fill="#f97316" opacity=".7" />
            </svg>
          }
        }
      </span>
      <div style="min-width:0;">
        <div style="font-size:12px;font-weight:600;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ name }}</div>
        <div style="font-size:10px;color:#475569;margin-top:1px;">{{ displayDate }}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
      @if (artifact.origin === 'task') {
        <span style="background:#dbeafe;color:#2563eb;font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:99px;border:1px solid #1d4ed833;">Tarefa {{ artifact.task_id }}</span>
      } @else {
        <span style="background:#dcfce7;color:#16a34a;font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:99px;border:1px solid #16a34a33;">Chat</span>
      }
      <a [href]="url" target="_blank" style="background:none;border:1px solid #e2e8f0;border-radius:6px;color:#f97316;padding:3px 8px;font-size:11px;text-decoration:none;">Abrir</a>
      <button [disabled]="deleting()" (click)="deleteArtifact()" title="Deletar" style="background:none;border:1px solid #3f3f46;border-radius:6px;color:#71717a;padding:3px 7px;font-size:12px;cursor:pointer;">✕</button>
    </div>
  </div>
  @if (artifact.type === 'chart') {
    <img [src]="url" style="width:100%;border-radius:6px;margin-top:8px;border:1px solid #e2e8f0;" loading="lazy" />
  }
</div>
